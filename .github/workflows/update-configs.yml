name: Update merged configs

on:
  schedule:
    - cron: "0 * * * *" # Каждый час в начале часа (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-merged-configs
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download, merge and deduplicate
        run: python merge_configs.py

      - name: Commit changes if output changed
        run: |
          git add all_configs.txt
          if git diff --cached --quiet; then
            echo "No changes in all_configs.txt"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update merged configs"
          git push
